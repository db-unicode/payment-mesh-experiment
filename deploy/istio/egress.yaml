apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: gateway-card-external
  namespace: payments
  labels: { networking.istio.io/enable-autoallocate-ip: "true" }
spec:
  hosts: [gateway-card.mesh.local]
  location: MESH_EXTERNAL
  ports:
    - { number: 80, name: http, protocol: HTTP }
    - { number: 443, name: https, protocol: HTTPS }
  resolution: DNS
  endpoints: [{ address: host.docker.internal, ports: { http: 8091, https: 8091 } }]
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: gateway-bank-external
  namespace: payments
  labels: { networking.istio.io/enable-autoallocate-ip: "true" }
spec:
  hosts: [gateway-bank.mesh.local]
  location: MESH_EXTERNAL
  ports:
    - { number: 80, name: http, protocol: HTTP }
    - { number: 443, name: https, protocol: HTTPS }
  resolution: DNS
  endpoints: [{ address: host.docker.internal, ports: { http: 8092, https: 8092 } }]
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata: { name: payment-egress, namespace: payments }
spec:
  selector: { istio: egressgateway }
  servers:
    - port: { number: 80, name: https-for-tls-origination, protocol: HTTPS }
      hosts: [gateway-card.mesh.local, gateway-bank.mesh.local]
      tls: { mode: ISTIO_MUTUAL }
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata: { name: payment-egress-mtls, namespace: payments }
spec:
  host: istio-egressgateway.istio-system.svc.cluster.local
  subsets:
    - name: card
      labels: { istio: egressgateway }
      trafficPolicy:
        portLevelSettings:
          - port: { number: 80 }
            tls: { mode: ISTIO_MUTUAL, sni: gateway-card.mesh.local }
    - name: bank
      labels: { istio: egressgateway }
      trafficPolicy:
        portLevelSettings:
          - port: { number: 80 }
            tls: { mode: ISTIO_MUTUAL, sni: gateway-bank.mesh.local }
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata: { name: gateway-card-routing, namespace: payments }
spec:
  hosts: [gateway-card.mesh.local]
  gateways: [mesh, payment-egress]
  http:
    - match:
        - gateways: [mesh]
          port: 80
          uri: { prefix: /v1/card/authorizations }
      route: [{ destination: { host: istio-egressgateway.istio-system.svc.cluster.local, subset: card, port: { number: 80 } } }]
      # Provider POSTs carry the idempotency key. Keep retries bounded and
      # limited to transport/provider-unavailable failures.
      timeout: 2s
      retries: { attempts: 2, perTryTimeout: 900ms, retryOn: "connect-failure,refused-stream,reset,unavailable,5xx" }
    - match:
        - gateways: [payment-egress]
          port: 80
          uri: { prefix: /v1/card/authorizations }
      route: [{ destination: { host: gateway-card.mesh.local, port: { number: 443 } } }]
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata: { name: gateway-bank-routing, namespace: payments }
spec:
  hosts: [gateway-bank.mesh.local]
  gateways: [mesh, payment-egress]
  http:
    - match:
        - gateways: [mesh]
          port: 80
          uri: { prefix: /v2/transfers }
      route: [{ destination: { host: istio-egressgateway.istio-system.svc.cluster.local, subset: bank, port: { number: 80 } } }]
      timeout: 2s
      retries: { attempts: 2, perTryTimeout: 900ms, retryOn: "connect-failure,refused-stream,reset,unavailable,5xx" }
    - match:
        - gateways: [payment-egress]
          port: 80
          uri: { prefix: /v2/transfers }
      route: [{ destination: { host: gateway-bank.mesh.local, port: { number: 443 } } }]
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata: { name: gateway-card-tls, namespace: istio-system }
spec:
  host: gateway-card.mesh.local
  workloadSelector:
    matchLabels: { istio: egressgateway }
  trafficPolicy:
    portLevelSettings:
      - port: { number: 443 }
        tls: { mode: SIMPLE, sni: gateway-card.mesh.local, credentialName: gateway-ca }
        connectionPool: { http: { http1MaxPendingRequests: 50, maxRequestsPerConnection: 10 } }
        outlierDetection: { consecutive5xxErrors: 5, interval: 5s, baseEjectionTime: 30s, maxEjectionPercent: 100 }
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata: { name: gateway-bank-tls, namespace: istio-system }
spec:
  host: gateway-bank.mesh.local
  workloadSelector:
    matchLabels: { istio: egressgateway }
  trafficPolicy:
    portLevelSettings:
      - port: { number: 443 }
        tls: { mode: SIMPLE, sni: gateway-bank.mesh.local, credentialName: gateway-ca }
        connectionPool: { http: { http1MaxPendingRequests: 50, maxRequestsPerConnection: 10 } }
        outlierDetection: { consecutive5xxErrors: 5, interval: 5s, baseEjectionTime: 30s, maxEjectionPercent: 100 }
