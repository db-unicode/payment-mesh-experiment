# Apply with istioctl install -f this file after installing the Istio CRDs.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata: { name: payment-mesh }
spec:
  meshConfig:
    enableTracing: true
    # Limit sidecar routes to registered in-mesh services and the two explicit
    # gateway ServiceEntries; AuthorizationPolicy and payment auth protect the
    # egress path and provider API respectively.
    outboundTrafficPolicy:
      mode: REGISTRY_ONLY
    defaultConfig:
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
      proxyStatsMatcher:
        inclusionRegexps:
          - ".*outlier_detection.*"
          - ".*upstream_rq_pending_overflow.*"
          - ".*upstream_cx_connect_fail.*"
    extensionProviders:
      - name: otel-tracing
        opentelemetry:
          service: otel-collector.observability.svc.cluster.local
          port: 4317
  components:
    ingressGateways: [{ name: istio-ingressgateway, enabled: true }]
    egressGateways: [{ name: istio-egressgateway, enabled: true }]
