apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources: [namespace.yaml, otel.yaml, jaeger.yaml, prometheus.yaml]
configMapGenerator:
  - name: otel-config
    files: [config.yaml=otel-collector-config.yaml]
  - name: prometheus-config
    files: [prometheus.yml=prometheus.yml]
