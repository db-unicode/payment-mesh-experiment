auth:
  strategy: anonymous
external_services:
  istio:
    root_namespace: istio-system
  prometheus:
    url: http://prometheus.observability:9090
  tracing:
    enabled: true
    internal_url: http://jaeger.observability:16686
    external_url: http://localhost:16686
    use_grpc: false
  grafana:
    enabled: true
    internal_url: http://grafana.observability:3000
    external_url: http://localhost:3000
    dashboards:
      - name: Payment Mesh - Demonstration
