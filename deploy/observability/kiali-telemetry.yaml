apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: kiali-prometheus-telemetry }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kiali
      app.kubernetes.io/instance: kiali
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
      ports: [{ protocol: TCP, port: 15020 }]
