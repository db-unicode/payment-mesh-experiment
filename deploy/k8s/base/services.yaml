apiVersion: apps/v1
kind: Deployment
metadata: { name: participant-payment-manager }
spec:
  replicas: 1
  selector: { matchLabels: { app: participant-payment-manager } }
  template:
    metadata: { labels: { app: participant-payment-manager } }
    spec:
      serviceAccountName: participant-payment-manager
      containers:
        - name: app
          image: payment-participant-manager:dev
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          env:
            - { name: PARTICIPANT_DATABASE_URL, value: "postgres://participants:participants@participant-db:5432/participants?sslmode=disable" }
---
apiVersion: v1
kind: Service
metadata: { name: participant-payment-manager }
spec: { selector: { app: participant-payment-manager }, ports: [{ name: http-api, port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-router }
spec:
  replicas: 2
  selector: { matchLabels: { app: payment-router } }
  template:
    metadata: { labels: { app: payment-router } }
    spec:
      serviceAccountName: payment-router
      containers:
        - name: app
          image: payment-router:dev
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          env:
            - { name: ROUTER_DATABASE_URL, value: "postgres://router:router@router-db:5432/router?sslmode=disable" }
            - { name: GATEWAY_CARD_URL, value: "http://gateway-card.mesh.local" }
            - { name: GATEWAY_BANK_URL, value: "http://gateway-bank.mesh.local" }
            - name: GATEWAY_PAYMENT_TOKEN
              valueFrom:
                secretKeyRef: { name: gateway-auth, key: GATEWAY_PAYMENT_TOKEN }
            - { name: APP_CIRCUIT_BREAKER_ENABLED, value: "false" }
---
apiVersion: v1
kind: Service
metadata: { name: payment-router }
spec: { selector: { app: payment-router }, ports: [{ name: http-api, port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-operator }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-operator } }
  template:
    metadata: { labels: { app: payment-operator } }
    spec:
      serviceAccountName: payment-operator
      containers:
        - name: app
          image: payment-operator:dev
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          env:
            - { name: OPERATOR_DATABASE_URL, value: "postgres://operator:operator@operator-db:5432/operator?sslmode=disable" }
            - { name: PARTICIPANT_MANAGER_URL, value: "http://participant-payment-manager:8080" }
            - { name: ROUTER_URL, value: "http://payment-router:8080" }
---
apiVersion: v1
kind: Service
metadata: { name: payment-operator }
spec: { selector: { app: payment-operator }, ports: [{ name: http-api, port: 8080, targetPort: 8080 }] }
